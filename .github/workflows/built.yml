name: Build iOS Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: iOS

      - name: Upload .geode file
        uses: actions/upload-artifact@v4
        with:
          name: input-indicator-ios
          path: ./*.geode
